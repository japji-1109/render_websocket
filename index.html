<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Live Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-amber: #d29922;
            --btn-bg: #21262d;
            --btn-hover: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-group h1 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-group p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .status-connecting {
            background: rgba(210, 153, 34, 0.15);
            color: var(--accent-amber);
            border-color: rgba(210, 153, 34, 0.3);
        }

        .status-connected {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
            border-color: rgba(63, 185, 80, 0.3);
        }

        .status-disconnected {
            background: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
            border-color: rgba(248, 81, 73, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .url-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .url-input {
            flex: 1;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px 14px;
            font-family: monospace;
            font-size: 0.85rem;
            outline: none;
        }

        .url-input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: #238636;
            border-color: rgba(240, 246, 252, 0.1);
            color: #fff;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .quick-actions span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .quick-btn {
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 6px;
        }

        .messages-container {
            background: #090d13;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 280px;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            scroll-behavior: smooth;
        }

        .message-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
        }

        .badge-client {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .badge-server {
            color: var(--accent-green);
            font-weight: 600;
        }

        .badge-system {
            color: var(--accent-amber);
            font-weight: 600;
        }

        .message-time {
            color: var(--text-muted);
        }

        .message-bubble {
            display: inline-block;
            max-width: 90%;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .client-msg .message-bubble {
            background: #1f2937;
            color: #e5e7eb;
            align-self: flex-start;
            border-left: 3px solid var(--accent-blue);
        }

        .server-msg .message-bubble {
            background: rgba(63, 185, 80, 0.12);
            color: #bbf7d0;
            align-self: flex-start;
            border-left: 3px solid var(--accent-green);
        }

        .system-msg .message-bubble {
            background: rgba(210, 153, 34, 0.12);
            color: #fef08a;
            align-self: flex-start;
            border-left: 3px solid var(--accent-amber);
        }

        .send-form {
            display: flex;
            gap: 10px;
        }

        .input-message {
            flex: 1;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px 14px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-message:focus {
            border-color: var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="title-group">
                <h1>⚡ WebSocket Terminal</h1>
                <p id="subheading">Ready for local & Render cloud hosting</p>
            </div>
            <div id="statusBadge" class="status-badge status-connecting">
                <span class="status-dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="url-box">
            <input type="text" id="serverUrl" class="url-input" placeholder="ws://..." />
            <button id="reconnectBtn" class="btn">Reconnect</button>
        </div>

        <div class="quick-actions">
            <span>Quick test:</span>
            <button class="btn quick-btn" onclick="sendQuickMessage('hi')">Send "hi"</button>
            <button class="btn quick-btn" onclick="sendQuickMessage('kaise ho')">Send "kaise ho"</button>
            <button class="btn quick-btn" onclick="sendQuickMessage('other')">Send Other</button>
            <button class="btn quick-btn" onclick="clearLog()">Clear Log</button>
        </div>

        <div id="messages" class="messages-container"></div>

        <form id="sendForm" class="send-form" onsubmit="handleSend(event)">
            <input type="text" id="messageInput" class="input-message" placeholder="Type a message (e.g. hi, kaise ho)..." autocomplete="off" />
            <button type="submit" class="btn btn-primary" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
        let socket = null;

        // Auto-detect correct WebSocket URL
        function getAutoSocketUrl() {
            if (window.location.origin.startsWith('http')) {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                return `${protocol}//${window.location.host}`;
            }
            return 'ws://localhost:4500';
        }

        const serverUrlInput = document.getElementById('serverUrl');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const reconnectBtn = document.getElementById('reconnectBtn');

        serverUrlInput.value = getAutoSocketUrl();

        function addLog(type, sender, text) {
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = `message-item ${type}-msg`;

            const badgeClass = type === 'server' ? 'badge-server' : type === 'client' ? 'badge-client' : 'badge-system';

            item.innerHTML = `
                <div class="message-meta">
                    <span class="${badgeClass}">${sender}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-bubble">${escapeHtml(text)}</div>
            `;
            messagesDiv.appendChild(item);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLog() {
            messagesDiv.innerHTML = '';
        }

        function updateStatus(status) {
            statusBadge.className = 'status-badge';
            if (status === 'connected') {
                statusBadge.classList.add('status-connected');
                statusText.textContent = 'Connected';
                sendBtn.disabled = false;
            } else if (status === 'connecting') {
                statusBadge.classList.add('status-connecting');
                statusText.textContent = 'Connecting...';
                sendBtn.disabled = true;
            } else {
                statusBadge.classList.add('status-disconnected');
                statusText.textContent = 'Disconnected';
                sendBtn.disabled = true;
            }
        }

        function connect() {
            if (socket) {
                try { socket.close(); } catch(e) {}
            }

            const url = serverUrlInput.value.trim();
            updateStatus('connecting');
            addLog('system', 'SYSTEM', `Attempting connection to ${url}...`);

            try {
                socket = new WebSocket(url);

                socket.onopen = () => {
                    updateStatus('connected');
                    addLog('system', 'SYSTEM', 'WebSocket connection established!');
                    console.log("Connected to WebSocket server");
                    // Auto-send hi on initial connect
                    socket.send("hi");
                    addLog('client', 'CLIENT (Auto)', 'hi');
                };

                socket.onmessage = (event) => {
                    console.log("Message from server:", event.data);
                    addLog('server', 'SERVER', event.data);

                    // Auto-reply logic as originally coded
                    if (event.data === "hello") {
                        setTimeout(() => {
                            if (socket && socket.readyState === WebSocket.OPEN) {
                                socket.send("kaise ho");
                                addLog('client', 'CLIENT (Auto)', 'kaise ho');
                            }
                        }, 800);
                    }
                };

                socket.onerror = (err) => {
                    console.error("WebSocket error:", err);
                    addLog('system', 'ERROR', 'WebSocket encountered an error.');
                };

                socket.onclose = () => {
                    updateStatus('disconnected');
                    addLog('system', 'SYSTEM', 'Connection closed.');
                };
            } catch (err) {
                updateStatus('disconnected');
                addLog('system', 'ERROR', err.message);
            }
        }

        function sendQuickMessage(msg) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected!');
                return;
            }
            socket.send(msg);
            addLog('client', 'CLIENT', msg);
        }

        function handleSend(event) {
            event.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected!');
                return;
            }
            socket.send(text);
            addLog('client', 'CLIENT', text);
            messageInput.value = '';
        }

        reconnectBtn.addEventListener('click', () => {
            connect();
        });

        // Initialize connection
        connect();
    </script>
</body>
</html>
